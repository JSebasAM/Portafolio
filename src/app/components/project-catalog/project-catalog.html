<section id="proyectos" class="section" aria-labelledby="proyectos-titulo">
  <div class="section-header">
    <span class="section-kicker">04 // PORTAFOLIO</span>
    <h2 id="proyectos-titulo" class="section-title">Catálogo de Proyectos</h2>
    <p class="section-lead">
      Selección de arquitecturas, aplicaciones Single Page y sistemas distribuidos construidos con
      rigor técnico, separación de capas y entrega continua.
    </p>
  </div>

  <ul class="grid">
    @for (project of projects; track project.nombre) {
      <li class="grid__item">
        <app-project-card [project]="project" />
      </li>
    }
  </ul>
</section>
