<article class="card">
  <h3 class="card__title">{{ project().nombre }}</h3>
  <p class="card__desc">{{ project().descripcion }}</p>

  <h4 class="card__subtitle">Tecnologías</h4>
  <ul class="tags" aria-label="Tecnologías de {{ project().nombre }}">
    @for (tech of project().tecnologias; track tech) {
      <li class="tags__item">{{ tech }}</li>
    }
  </ul>

  <h4 class="card__subtitle">Características</h4>
  <ul class="card__features">
    @for (feature of project().caracteristicas; track feature) {
      <li>{{ feature }}</li>
    }
  </ul>

  <div class="card__actions">
    <a
      class="btn btn--secondary"
      [href]="project().repoUrl"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="'Repositorio de ' + project().nombre + ' (se abre en una pestaña nueva)'"
      >Repositorio</a
    >
    <a
      class="btn btn--primary"
      [href]="project().demoUrl"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="'Ver aplicación ' + project().nombre + ' (se abre en una pestaña nueva)'"
      >Ver aplicación</a
    >
  </div>
</article>
